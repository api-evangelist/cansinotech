description: 'CanSino Biologics (康希诺生物, cansinotech.com.cn / cansinotech.com) is a Tianjin-based
  Chinese biopharmaceutical company founded in 2009 and dual-listed on the Hong Kong and Shanghai
  (STAR) exchanges. It researches, manufactures, and commercializes human vaccines across five
  proprietary technology platforms, with a portfolio covering COVID-19, meningococcal, pneumococcal,
  tuberculosis, Ebola, and DTcP indications. Surfaced as a portfolio company of Qiming Ventures and
  added to the API Evangelist network. As of this enrichment pass the company publishes no public
  API, developer portal, SDKs, or technical documentation; only its corporate web presence was found.'
